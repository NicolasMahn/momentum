# Momentum's website on the web server: the static files `scripts/website.py publish` puts into
# ./public, served on the network of the server's only Caddy. That Caddy belongs to the
# AV_Stuttgart repository, whose deployment/Caddyfile sends momentum.nicolas-mahn.de here. Its own
# Caddyfile also passes the app's feedback on to deploy/feedback.
services:
  site:
    image: caddy:2-alpine
    container_name: momentum-site
    volumes:
      - ./public:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    name: av-stuttgart_default
    external: true
