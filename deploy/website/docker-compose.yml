# Momentum's website on the web server: the static files `scripts/website.py publish` puts into
# ./public, served on the network of the server's only Caddy. That Caddy belongs to the
# AV_Stuttgart repository, whose deployment/Caddyfile sends momentum.nicolas-mahn.de here. This
# container's own Caddyfile also passes the route map's tiles on to the map stack (deploy/maps).
services:
  site:
    image: caddy:2-alpine
    container_name: momentum-site
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./public:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    name: av-stuttgart_default
    external: true
