name: Unit tests

# Every pull request into `main` runs the JVM tests, and a ruleset on `main` lets it merge only
# when they are green. They stay out of the closed-test upload on purpose: a failing test stops a
# change from reaching `main`, never a build of what `main` already holds.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request replaces the run still going for the old one.
concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code counts the commits, so the build needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
